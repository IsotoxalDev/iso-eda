[package]
name = "eda-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "iso-eda"
path = "src/main.rs"

[dependencies]
eda-ui = { path = "../eda-ui" }
# Needed directly (not just transitively through eda-ui) to select the
# wgpu 30 backend before constructing the shell; GPL-3.0-only option,
# see crates/eda-ui/Cargo.toml's header comment and ADR-001.
slint = { version = "~1.18.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "compat-1-2",
] }
# Binaries use anyhow per CLAUDE.md; already in ADR-001's sign-off table.
anyhow = "1"
