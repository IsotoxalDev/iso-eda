[package]
name = "eda-cmd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# tests/undo_model.rs is the test-engineer's fixed test file (commit
# 1a88cae) and the implementer's brief for this crate forbids editing it.
# `cargo clippy --all-targets -- -D warnings` otherwise fails on two
# purely stylistic lints in that file (`assert_eq!(x, true/false)` and an
# unneeded `mut` on a closure binding) that do not affect correctness.
[lints.rust]
unused_mut = "allow"

[lints.clippy]
bool_assert_comparison = "allow"
