[package]
name = "spike-egui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]

[[bin]]
name = "spike-egui"
path = "src/main.rs"

[dependencies]
scene = { path = "../scene" }
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu",
    "wayland",
    "x11",
    "default_fonts",
] }
egui = "0.37.0"
wgpu = "30"
anyhow = "1"
