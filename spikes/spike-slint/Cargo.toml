# SPDX-License-Identifier: GPL-3.0-or-later
#
# Linked against Slint under its GPL-3.0-only license option (see
# docs/adr/001-ui-toolkit.md "Consequences"): this binary's distributed
# artifacts would be GPL-3.0 exactly, not "or later". The crate's own
# source stays GPL-3.0-or-later like the rest of the repository.
[package]
name = "spike-slint"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
build = "build.rs"

[workspace]

[[bin]]
name = "spike-slint"
path = "src/main.rs"

[dependencies]
scene = { path = "../scene" }
canvas-wgpu = { path = "../canvas-wgpu" }
# Tilde requirement recommended by Slint for `unstable-*` features (they
# are not covered by Slint's usual API stability guarantees).
slint = { version = "~1.18.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "compat-1-2",
] }
anyhow = "1"

[build-dependencies]
slint-build = "1.18.1"
